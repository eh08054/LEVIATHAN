<!doctype html>
<!-- City model prototype v2 (2026-11-26, free, option C): the main screen as the AI's control room. A dimmed pixel
     panorama (pano_b.png) sets the mood behind a city model drawn in code. Drag pans (the city and the backdrop
     follow the mouse), right drag turns, the wheel zooms; close in, the camera tilts to look down on a district.
     v2: a city twice as large (18 x 12 city blocks, avenues every third street), the ground runs on to a hazy
     horizon instead of ending at a table edge, varied buildings (podium towers, slabs, domes, cylinders, a stadium,
     solar fields, warehouses with drone pads, cranes), an elevated maglev loop with trains, pods on every street,
     drone lanes, avenue lights, distance fog, window lights at night. -->
<html lang="ko">

<style>

    --c: rgba(53, 201, 232, 0.85);
    background-image: linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)),
      linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)),
      linear-gradient(90deg, rgba(8, 18, 36, 0.62), rgba(8, 18, 36, 0.30));
    background-size: 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px, 100% 100%;

  #top { position: absolute; z-index: 2; left: 0; top: 0; right: 0; height: 44px; padding: 0 20px; display: flex; align-items: center; gap: 20px;
    background: linear-gradient(rgba(6, 14, 30, 0.9), rgba(6, 14, 30, 0.55)); border-bottom: 1px solid rgba(53, 201, 232, 0.35); }
  #top b { color: #35c9e8; letter-spacing: 3px; }

  .ix .l b { font-size: 18px; color: #e6eefc; } .ix .d { font-size: 11px; margin-left: 6px; }
  .bar { height: 3px; background: rgba(159, 179, 209, 0.2); margin-top: 2px; } .bar i { display: block; height: 100%; background: #35c9e8; }

<body>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const mini = document.getElementById('m'), mg = mini.getContext('2d');
let W, H;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);
const pano = new Image(); pano.src = 'pano_b.png';
let seed = 7; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pickR = a => a[Math.floor(rand() * a.length)];

// ---------------------------------------------------------------- the plan: Tools/Art/city_guide.py's 9 x 6, each
// letter now covering 2 x 2 city blocks; streets between blocks, an avenue every third street
const BASE = ["HHHMMHHHS", "HHCCMHHRR", "EECAACCRR", "ELCAACUUH", "LLKUUDDHH", "LKKUUDDHH"];
const PLAN = []; for (const row of BASE) { const r = [...row].map(ch => ch + ch).join(''); PLAN.push(r, r); }
const ROWS = PLAN.length, COLS = PLAN[0].length, CELL = 100, ST = 18, AV = 40;
const gap = i => (i % 3 === 0 ? AV : ST);                     // the road before block i
const XS = [], YS = []; { let x = AV; for (let c = 0; c < COLS; c++) { XS.push(x); x += CELL + gap(c + 1); } }
{ let y = AV; for (let r = 0; r < ROWS; r++) { YS.push(y); y += CELL + gap(r + 1); } }
const CW = XS[COLS - 1] + CELL + AV, CH = YS[ROWS - 1] + CELL + AV;
const D = {
  H: ['주거', 'home', [236, 238, 244]], M: ['의료·생명', 'medical', [246, 230, 230]], S: ['공사 부지', 'site', [226, 212, 186]],
  C: ['상업', 'shop', [214, 232, 252]], R: ['연구·개발', 'research', [222, 244, 234]], E: ['에너지·발전', 'energy', [214, 226, 244]],
  A: ['관리 (AI 센터)', 'admin', [232, 250, 255]], L: ['물류·산업', 'logistics', [224, 224, 232]], U: ['문화·여가', 'culture', [232, 244, 240]],
  K: ['치안·보안', 'security', [226, 228, 244]], Dd: ['교육', 'edu', [246, 240, 228]],
};
const kindAt = (c, r) => { const k = PLAN[r][c]; return k === 'D' ? 'Dd' : k; };
const cellRect = (c, r) => { const x0 = XS[c], y0 = YS[ROWS - 1 - r]; return [x0, y0, x0 + CELL, y0 + CELL]; };
const STATE = {};
for (const k of Object.keys(D)) STATE[k] = { tension: Math.round(rand() * 85), pop: k === 'H' ? 58000 : Math.round(1500 + rand() * 9000), lit: 0.4 + rand() * 0.5 };
STATE.U.tension = 82; STATE.S.pop = 0; STATE.A.tension = 12;

// ---------------------------------------------------------------- the city's things
// items are drawn far to near; an item is a list of parts drawn bottom-up (a podium, then its tower)
const items = [], decals = [], lots = [], cranes = [];
function item(k, cx, cy, parts) { items.push({ k, cx, cy, parts, win: rand() }); }
const box = (x0, y0, x1, y1, z0, h, o = {}) => ({ t: 'box', x0, y0, x1, y1, z0, h, ...o });
const cyl = (cx, cy, rad, z0, h, o = {}) => ({ t: 'cyl', cx, cy, rad, z0, h, sides: o.sides || 12, ...o });
function tower(k, x, y, w, l, h) {   // podium + slimmer shaft + crown with a light band
  const ph = 10 + rand() * 8, inset = Math.min(w, l) * 0.18;
  const parts = [box(x, y, x + w, y + l, 0, ph), box(x + inset, y + inset, x + w - inset, y + l - inset, ph, h - ph)];
  if (rand() < 0.6) parts.push(box(x + inset * 1.6, y + inset * 1.6, x + w - inset * 1.6, y + l - inset * 1.6, h, 6, { light: true }));
  item(k, x + w / 2, y + l / 2, parts);
}
function slab(k, x, y, w, l, h) { item(k, x + w / 2, y + l / 2, [box(x, y, x + w, y + l, 0, h, { stripe: rand() < 0.5 })]); }
const tall = r => r <= 3 ? 1 : r <= 7 ? 0.65 : 0.35;   // the back of the city stands taller

for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const k = kindAt(c, r), [x0, y0, x1, y1] = cellRect(c, r), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  lots.push({ x0, y0, x1, y1, k, c, r });
  const t = tall(r);
  if (k === 'H') {
    const v = rand();
    if (v < 0.45) { // courtyard of slabs
      slab(k, x0 + 4, y0 + 4, 92, 16, 40 + 60 * t * rand() + 20 * t); slab(k, x0 + 4, y0 + 80, 92, 16, 50 + 80 * t);
      slab(k, x0 + 4, y0 + 24, 16, 52, 30 + 40 * t); decals.push({ t: 'rect', x0: x0 + 28, y0: y0 + 28, x1: x1 - 10, y1: y1 - 28, col: [200, 214, 206] });
    } else if (v < 0.85) { // two towers and a low row
      tower(k, x0 + 6, y0 + 50, 38, 38, 70 + 110 * t * (0.6 + rand() * 0.6)); tower(k, x0 + 56, y0 + 54, 36, 36, 60 + 90 * t * (0.6 + rand() * 0.6));
      slab(k, x0 + 6, y0 + 6, 88, 22, 12);
    } else { tower(k, x0 + 22, y0 + 22, 56, 56, 140 + 120 * t); }
  } else if (k === 'C') {
    const v = rand();
    if (v < 0.5) { tower(k, x0 + 8, y0 + 8, 50, 50, 90 + 160 * t * rand() + 40); slab(k, x0 + 64, y0 + 8, 30, 86, 24 + rand() * 30); }
    else if (v < 0.8) { for (const [a, b] of [[0, 0], [1, 0], [0, 1], [1, 1]]) tower(k, x0 + 6 + a * 50, y0 + 6 + b * 50, 40, 40, 40 + rand() * 120 * (0.5 + t)); }
    else { decals.push({ t: 'disc', cx, cy, rad: 34, col: [190, 226, 240] }); item(k, cx, cy, [cyl(cx, cy, 10, 0, 18, { holo: true })]); }
  } else if (k === 'M') {
    if ((c + r) % 2 === 0) item(k, cx, cy, [box(x0 + 6, y0 + 6, x1 - 6, y1 - 6, 0, 16), box(x0 + 18, y0 + 30, x1 - 18, y1 - 14, 16, 34, { pad: true })]);
    else { slab(k, x0 + 8, y0 + 8, 84, 30, 22); decals.push({ t: 'disc', cx, cy: cy + 20, rad: 22, col: [140, 196, 226] }); }
  } else if (k === 'E') {
    if ((c + r) % 2 === 0) decals.push({ t: 'solar', x0: x0 + 4, y0: y0 + 4, x1: x1 - 4, y1: y1 - 4 });
    else { for (const [a, b] of [[0, 0], [1, 0], [0, 1]]) item(k, x0 + 28 + a * 46, y0 + 28 + b * 46, [cyl(x0 + 28 + a * 46, y0 + 28 + b * 46, 18, 0, 26, { band: true })]);
      slab(k, x0 + 56, y0 + 56, 38, 38, 12); }
  } else if (k === 'R') {
    if ((c * 3 + r) % 3 === 0) item(k, cx, cy, [box(x0 + 10, y0 + 10, x1 - 10, y1 - 10, 0, 14), cyl(cx, cy, 24, 14, 14, { dome: true })]);
    else { slab(k, x0 + 6, y0 + 6, 56, 30, 18); tower(k, x0 + 60, y0 + 40, 34, 50, 50 + rand() * 50); decals.push({ t: 'rect', x0: x0 + 8, y0: y0 + 50, x1: x0 + 52, y1: y1 - 8, col: [204, 222, 214] }); }
  } else if (k === 'L') {
    item(k, cx, cy, [box(x0 + 4, y0 + 10, x1 - 4, y1 - 24, 0, 16, { pad: true })]);
    for (let i = 0; i < 5; i++) decals.push({ t: 'rect', x0: x0 + 6 + i * 18, y0: y0 + 80, x1: x0 + 20 + i * 18, y1: y0 + 92, col: pickR([[80, 120, 170], [200, 110, 80], [120, 150, 100]]) });
  } else if (k === 'K') {
    if ((c + r) % 2 === 0) item(k, cx, cy, [cyl(cx, cy, 12, 0, 90, { sides: 8 }), cyl(cx, cy, 20, 90, 10, { sides: 8, light: true })]);
    else slab(k, x0 + 8, y0 + 8, 84, 60, 20);
  } else if (k === 'U') {
    const v = (c * 7 + r * 3) % 4;
    if (v === 0) item(k, cx, cy, [cyl(cx, cy, 44, 0, 16, { sides: 20, ring: true })]);
    else if (v === 1) decals.push({ t: 'rect', x0: x0 + 10, y0: y0 + 30, x1: x1 - 10, y1: y1 - 30, col: [110, 180, 220], water: true });
    else { decals.push({ t: 'disc', cx, cy, rad: 38, col: [214, 222, 226] }); item(k, cx, cy, [cyl(cx, cy, 8, 0, 6, { holo: true })]); }
  } else if (k === 'Dd') {
    if ((c + r) % 2 === 0) { decals.push({ t: 'field', x0: x0 + 6, y0: y0 + 30, x1: x1 - 6, y1: y1 - 6 }); slab(k, x0 + 6, y0 + 4, 88, 20, 14); }
    else { slab(k, x0 + 8, y0 + 8, 50, 84, 18); tower(k, x0 + 64, y0 + 50, 30, 42, 46); }
  } else if (k === 'S') {
    for (const [a, b, w, l] of [[0, 0, 100, 4], [0, 96, 100, 4], [0, 0, 4, 100], [96, 0, 4, 100]]) item(k, x0 + a + w / 2, y0 + b + l / 2, [box(x0 + a, y0 + b, x0 + a + w, y0 + b + l, 0, 7, { panel: true })]);
    decals.push({ t: 'rect', x0: x0 + 4, y0: y0 + 4, x1: x1 - 4, y1: y1 - 4, col: [190, 168, 130] });
    if ((c + r) % 2 === 0) { item(k, cx, cy, [box(cx - 22, cy - 22, cx + 22, cy + 22, 0, 40, { frame: true })]); cranes.push({ x: cx + 30, y: cy + 30, h: 110, ph: rand() * 6 }); }
  }
}
// the AI centre: one landmark over its 4 x 4 blocks
const aLots = lots.filter(l => l.k === 'A');
const AX = (Math.min(...aLots.map(l => l.x0)) + Math.max(...aLots.map(l => l.x1))) / 2, AY = (Math.min(...aLots.map(l => l.y0)) + Math.max(...aLots.map(l => l.y1))) / 2;
decals.push({ t: 'disc', cx: AX, cy: AY, rad: 200, col: [226, 232, 236] }, { t: 'rect', x0: AX - 40, y0: AY - 230, x1: AX + 40, y1: AY - 70, col: [110, 186, 226], water: true });
item('A', AX, AY, [cyl(AX, AY, 110, 0, 40, { sides: 24 }), cyl(AX, AY, 70, 40, 90, { sides: 20 }), cyl(AX, AY, 26, 130, 120, { sides: 12, core: true })]);
const centreOf = {};
for (const k of Object.keys(D)) { const ls = lots.filter(l => l.k === k); centreOf[k] = [ls.reduce((s, l) => s + (l.x0 + l.x1) / 2, 0) / ls.length, ls.reduce((s, l) => s + (l.y0 + l.y1) / 2, 0) / ls.length]; }
// a district's label and fly-to point sit on its own block nearest its middle (commerce rings the AI centre,
// so its plain average would land on the centre)
for (const k of Object.keys(D)) { if (k === 'A') { centreOf.A = [AX, AY]; continue; }
  const [mx, my] = centreOf[k]; let best = null, bd = 1e18;
  for (const l of lots) if (l.k === k) { const d = ((l.x0 + l.x1) / 2 - mx) ** 2 + ((l.y0 + l.y1) / 2 - my) ** 2; if (d < bd) { bd = d; best = l; } }
  centreOf[k] = [(best.x0 + best.x1) / 2, (best.y0 + best.y1) / 2]; }
// the maglev loop runs above the inner avenues
const LOOP = [[XS[3] - AV / 2, YS[3] - AV / 2], [XS[15] - AV / 2, YS[3] - AV / 2], [XS[15] - AV / 2, YS[9] - AV / 2], [XS[3] - AV / 2, YS[9] - AV / 2]];
const LOOPLEN = 2 * ((LOOP[1][0] - LOOP[0][0]) + (LOOP[2][1] - LOOP[1][1]));
function onLoop(s) {
  s = ((s % LOOPLEN) + LOOPLEN) % LOOPLEN;
  for (let i = 0; i < 4; i++) { const a = LOOP[i], b = LOOP[(i + 1) % 4], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (s <= len) return [a[0] + (b[0] - a[0]) * s / len, a[1] + (b[1] - a[1]) * s / len]; s -= len; }
  return LOOP[0];
}
// road centre lines (for pods) and avenue lights
const roadsX = [AV / 2], roadsY = [AV / 2];
for (let c = 0; c < COLS; c++) roadsX.push(XS[c] + CELL + gap(c + 1) / 2);
for (let r = 0; r < ROWS; r++) roadsY.push(YS[r] + CELL + gap(r + 1) / 2);

// ---------------------------------------------------------------- camera
const HOME = 3000, DMIN = 600, DMAX = 4600;   // home: the city runs past the edges of the screen
const cam = { tx: CW / 2, ty: CH * 0.42, dist: HOME, yaw: 0, goal: null };
let style = 'solid', layer = 'none', hour = 15, focus = null, hover = null, basis, speed = 1, last = 0, HUD = true;
const LENS = 0.68;   // the optical centre sits below the middle: the city settles low, the sky above holds the data band
function pitch() { const t = Math.min(1, Math.max(0, (DMAX - cam.dist) / (DMAX - DMIN))); return (32 + 54 * t * t) * Math.PI / 180; }
function setBasis() {
  const p = pitch(), s = Math.sin(cam.yaw), c = Math.cos(cam.yaw);
  const f = [s * Math.cos(p), c * Math.cos(p), -Math.sin(p)], r = [c, -s, 0];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  basis = { f, r, u, pos: [cam.tx - cam.dist * f[0], cam.ty - cam.dist * f[1], -cam.dist * f[2]], F: H * 1.7 };
}
function proj(x, y, z) {
  const { f, r, u, pos, F } = basis, vx = x - pos[0], vy = y - pos[1], vz = z - pos[2];
  const zf = Math.max(1, vx * f[0] + vy * f[1] + vz * f[2]);
  return [W / 2 + F * (vx * r[0] + vy * r[1]) / zf, H * LENS - F * (vx * u[0] + vy * u[1] + vz * u[2]) / zf, zf];
}
function ground(sx, sy) {
  const { f, r, u, pos, F } = basis, a = (sx - W / 2) / F, b = -(sy - H * LENS) / F;
  const d = [f[0] + a * r[0] + b * u[0], f[1] + a * r[1] + b * u[1], f[2] + a * r[2] + b * u[2]];
  if (d[2] >= -1e-4) return null;
  const t = -pos[2] / d[2]; return [pos[0] + t * d[0], pos[1] + t * d[1]];
}
const lotAt = (x, y) => lots.find(l => x >= l.x0 - ST / 2 && x <= l.x1 + ST / 2 && y >= l.y0 - ST / 2 && y <= l.y1 + ST / 2);

  if (cs.length === 4) { mg.strokeStyle = '#4c8dff'; mg.lineWidth = 2; mg.beginPath(); cs.forEach((c, i) => { const p = M(c[0], c[1]); i ? mg.lineTo(p[0], p[1]) : mg.moveTo(p[0], p[1]); }); mg.closePath(); mg.stroke(); }
  mg.restore();
  mini.toWorld = (mx, my) => [(mx - ox) / s, CH - (my - oy) / s];
}
function showCard(k) {
  const st = STATE[k], c = document.getElementById('card'), stage = st.tension >= 80 ? '계기' : st.tension >= 60 ? '모임' : st.tension >= 40 ? '수군거림' : st.tension >= 20 ? '불만' : '잠잠';
  c.style.display = 'block';
  c.innerHTML = `<h3>${D[k][0]}</h3>
    <div class="row"><span>인구</span><b>${st.pop.toLocaleString()}명</b></div>
    <div class="row"><span>긴장</span><b style="color:${rgb(tensionColor(st.tension))}">${st.tension} · ${stage}</b></div>
    <div class="row"><span>입주·불빛</span><b>${Math.round(st.lit * 100)}%</b></div>
    <button onclick="location.href='observe.html?block=${D[k][1]}'">카메라 보기 (블록 관찰)</button>
    <button style="background:#192b46;border:1px solid #35c9e8" onclick="cam.goal={tx:${centreOf[k][0]},ty:${centreOf[k][1]},dist:${DMIN + 100}}">위에서 내려다보기</button>`;
}

// ---------------------------------------------------------------- input
let drag = null;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, btn: e.button, moved: 0, g: ground(e.clientX, e.clientY) }; cam.goal = null; });
addEventListener('mouseup', e => {
  if (drag && drag.moved < 4 && drag.btn === 0) { const gp = ground(e.clientX, e.clientY), l = gp && lotAt(gp[0], gp[1]); if (l) { focus = l.k; showCard(l.k); } }
  drag = null;
});
addEventListener('mousemove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    if (drag.btn === 2) cam.yaw += dx * 0.005;
    else if (drag.g) {   // the ground point under the mouse stays under the mouse: the city follows the hand
      setBasis(); const now = ground(e.clientX, e.clientY);
      if (now) { cam.tx += drag.g[0] - now[0]; cam.ty += drag.g[1] - now[1]; }
    }
    cam.tx = Math.max(-300, Math.min(CW + 300, cam.tx)); cam.ty = Math.max(-300, Math.min(CH + 300, cam.ty));
  }
  const gp = ground(e.clientX, e.clientY), l = gp && lotAt(gp[0], gp[1]), tip = document.getElementById('tip');
  hover = l ? l.k : null;
  if (l && !drag) { tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 10 + 'px'; tip.textContent = `${D[l.k][0]} · 긴장 ${STATE[l.k].tension}`; }
  else tip.style.display = 'none';
});
cv.addEventListener('wheel', e => {
  e.preventDefault(); cam.goal = null;
  const before = ground(e.clientX, e.clientY);
  cam.dist = Math.max(DMIN, Math.min(DMAX, cam.dist * (e.deltaY > 0 ? 1.12 : 0.89)));
  setBasis(); const after = ground(e.clientX, e.clientY);
  if (before && after) { cam.tx += before[0] - after[0]; cam.ty += before[1] - after[1]; }
}, { passive: false });
mini.addEventListener('click', e => { const r = mini.getBoundingClientRect(), [x, y] = mini.toWorld(e.clientX - r.left, e.clientY - r.top), l = lotAt(x, y); if (l) flyTo(l.k); });
addEventListener('keydown', e => { if (e.key === 'Escape') { cam.goal = { tx: CW / 2, ty: CH * 0.42, dist: HOME }; focus = null; document.getElementById('card').style.display = 'none'; } });
function pick(sel, attr, set) { for (const b of document.querySelectorAll(sel)) b.onclick = () => { for (const o of document.querySelectorAll(sel)) o.classList.toggle('on', o === b); set(b.dataset[attr]); }; }
const mark = (sel, attr, v) => { for (const o of document.querySelectorAll(sel)) o.classList.toggle('on', o.dataset[attr] === v); };
pick('[data-l]', 'l', v => layer = v);
pick('[data-st]', 'st', v => style = v);
pick('[data-s]', 's', v => speed = +v);
pick('[data-v]', 'v', v => { const t = document.getElementById('toast');
  if (v === 'image') { t.style.display = 'block'; t.innerHTML = '<h3>도시 이미지 보기</h3>모형을 바탕으로 그린 도시 그림 위에 A안 틀(지금 게임의 메인 화면)을 씌우는 모드입니다. 이 시안에는 아직 없습니다.<br><br><button class="btn on" onclick="document.querySelector(\'[data-v=model]\').click()">입체 모형으로</button>'; }
  else t.style.display = 'none'; });
document.getElementById('time').oninput = e => { hour = +e.target.value; };
for (const [k, v] of new URLSearchParams(location.search)) {   // ?style=holo&layer=tension&hour=21&focus=H&dist=900 (screenshots)
  if (k === 'style') { style = v; mark('[data-st]', 'st', v); } if (k === 'layer') { layer = v; mark('[data-l]', 'l', v); } if (k === 'hour') { hour = +v; speed = 0; mark('[data-s]', 's', '0'); }
  if (k === 'focus') { const [x, y] = centreOf[v]; cam.tx = x; cam.ty = y; cam.dist = 1300; focus = v; showCard(v); }
  if (k === 'dist') cam.dist = +v;
  if (k === 'hud' && v === '0') { HUD = false; document.body.classList.add('nohud'); }
}
// ---------------------------------------------------------------- HUD data (made up for the trial; the game feeds the real values)
const IDX = [['행복', 62, 1.2], ['사회 안정', 71, -0.4], ['사회 정합', 58, 0.8], ['자율성 (인지)', 66, 0.3], ['자율성 (실질)', 41, -1.1]];
document.getElementById('ixs').innerHTML = IDX.map(([n, v, d]) => {
  const good = n === '자율성 (실질)' ? d < 0 : d > 0, col = n === '자율성 (실질)' && d < 0 ? '#f2a03d' : good ? '#4fd18b' : '#ee5a5a';
  return `<div class="ix"><div class="l"><span>${n}</span><span><b class="num">${v}</b><span class="d num" style="color:${col}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span></span></div><div class="bar"><i style="width:${v}%;background:${v < 45 ? '#f2a03d' : '#35c9e8'}"></i></div></div>`; }).join('');
const ALERTS = [['U', '#ee5a5a', '문화·여가 · 모임', '광장에 사람이 모이고 있다 · 긴장 82'], ['K', '#f2a03d', '치안·보안 · 게이트', '바깥 대기열 1,240명 · 어제보다 +180'], ['E', '#f2a03d', '에너지·발전 · 예비율 12%', '오후 2시 냉방 수요 최고치 예상'], ['H', '#35c9e8', '주거 · 주목 시민', '한소미가 3일째 집 밖에 나오지 않았다']];
document.getElementById('als').innerHTML = ALERTS.map(([k, c, a, b]) => `<div class="al" onclick="flyTo('${k}')"><span class="dot" style="background:${c}"></span><div>${a}<small>${b}</small></div></div>`).join('');
// the sky's city pulse: three signals that follow the hour; tension rises with the culture district
const PULSE = [{ n: '도시 긴장', c: [238, 90, 90], f: h => 38 + 10 * Math.sin(h * 0.9) + (h > 17 && h < 22 ? 14 : 0) }, { n: '이동 인구', c: [53, 201, 232], f: h => 20 + 55 * Math.exp(-((h - 8.5) ** 2) / 1.5) + 50 * Math.exp(-((h - 18.5) ** 2) / 2) + 12 * Math.exp(-((h - 13) ** 2) / 3) },
  { n: '전력 부하', c: [242, 160, 61], f: h => 40 + 45 * Math.exp(-((h - 14.5) ** 2) / 8) + 15 * Math.exp(-((h - 20) ** 2) / 3) }];
function drawSky(time, hz) {
  // a band under the top bar, between the side panels; over the sky it floats free, over the city it gets a soft shade
  const top = 60, bot = top + Math.max(150, Math.min(210, H * 0.22));
  const x0 = Math.max(300, W * 0.24), x1 = Math.min(W - 330, W * 0.76);
  g.save();
  const sh = g.createLinearGradient(0, top - 16, 0, bot + 30);
  sh.addColorStop(0, 'rgba(6,14,30,0.75)'); sh.addColorStop(0.75, 'rgba(6,14,30,0.55)'); sh.addColorStop(1, 'rgba(6,14,30,0)');
  g.fillStyle = sh; g.fillRect(x0 - 120, top - 16, x1 - x0 + 170, bot - top + 46);
  // the AI's line, as broadcast on every screen
  g.textAlign = 'center'; g.font = '11px "Malgun Gothic"'; g.fillStyle = 'rgba(53,201,232,0.8)'; g.fillText('송출 중인 문구 · 전 구역 412개 화면', (x0 + x1) / 2, top + 12);
  g.font = 'bold 22px "Malgun Gothic"'; g.fillStyle = 'rgba(230,245,255,0.95)'; g.shadowColor = 'rgba(53,201,232,0.8)'; g.shadowBlur = 12;
  g.fillText('오늘도 힘찬 하루', (x0 + x1) / 2, top + 38); g.shadowBlur = 0;
  // the three signals: 24 hours, now marked, the future dimmed
  const rows = PULSE.length, rh = Math.min(46, (bot - top - 58) / rows);
  PULSE.forEach((p, i) => {
    const y0 = top + 54 + i * rh, yb = y0 + rh - 8;
    g.strokeStyle = 'rgba(53,201,232,0.12)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x0, yb); g.lineTo(x1, yb); g.stroke();
    for (const past of [true, false]) {
      g.beginPath();
      for (let s = 0; s <= 240; s++) { const h = s / 10; if (past ? h > hour : h < hour) continue;
        const v = p.f(h) + Math.sin(h * 13 + i) * 2.5 + (past ? Math.sin(time / 300 + h * 40) * 0.8 : 0), x = x0 + (x1 - x0) * h / 24, y = yb - (rh - 12) * Math.min(1, v / 100);
        g.lineTo(x, y); }
      g.strokeStyle = rgb(p.c, past ? 0.9 : 0.25); g.lineWidth = past ? 1.6 : 1; g.setLineDash(past ? [] : [3, 4]); g.stroke(); g.setLineDash([]);
    }
    const nx = x0 + (x1 - x0) * hour / 24, nv = p.f(hour), ny = yb - (rh - 12) * Math.min(1, nv / 100);
    g.fillStyle = rgb(p.c, 1); g.beginPath(); g.arc(nx, ny, 3, 0, 7); g.fill();
    g.textAlign = 'right'; g.font = '11px "Malgun Gothic"'; g.fillStyle = 'rgba(196,210,232,0.85)'; g.fillText(p.n, x0 - 10, yb - 4);
    g.textAlign = 'left'; g.font = '600 15px "Rajdhani","Bahnschrift"'; g.fillStyle = rgb(p.c, 1); g.fillText(String(Math.round(nv)), x1 + 10, yb - 3);
  });
  const nx = x0 + (x1 - x0) * hour / 24;
  g.strokeStyle = 'rgba(230,245,255,0.35)'; g.beginPath(); g.moveTo(nx, top + 50); g.lineTo(nx, bot); g.stroke();
  g.textAlign = 'center'; g.font = '10px "Malgun Gothic"'; g.fillStyle = 'rgba(159,179,209,0.7)';
  for (const h of [0, 6, 12, 18, 24]) g.fillText(String(h).padStart(2, '0') + ':00', x0 + (x1 - x0) * h / 24, bot + 2);
  g.restore(); g.textAlign = 'left';
}
function drawTags(near) {
  // a data tag over each district: ground dot, leader line, name, population and a tension bar
  if (near >= 0.7) return;
  const a = 1 - near / 0.7;
  g.font = 'bold 12px "Malgun Gothic"';
  const placed = [];
  // the AI centre first, then the rest; a tag that would cover one already placed climbs above it
  for (const k of ['A', ...Object.keys(D).filter(k => k !== 'A')]) {
    const [x, y] = centreOf[k], st = STATE[k], base = proj(x, y, 0), p = proj(x, y, k === 'A' ? 330 : 120);
    if (p[0] < -100 || p[0] > W + 100) continue;
    const tc = tensionColor(st.tension), hot = st.tension >= 60, w = Math.max(g.measureText(D[k][0]).width, 64) + 16;
    const bx = p[0] - w / 2; let by = p[1] - 36;
    for (let n = 0; n < 6; n++) { const hit = placed.find(r => bx < r[0] + r[2] + 4 && bx + w + 4 > r[0] && by < r[1] + 38 && by + 38 > r[1]); if (!hit) break; by = hit[1] - 40; }
    placed.push([bx, by, w]);
    g.strokeStyle = rgb(hot ? tc : [53, 201, 232], 0.7 * a); g.lineWidth = 1; g.beginPath(); g.moveTo(base[0], base[1]); g.lineTo(p[0], by + 34); g.stroke();
    g.fillStyle = rgb(hot ? tc : [53, 201, 232], a); g.beginPath(); g.arc(base[0], base[1], 2.5, 0, 7); g.fill();
    g.fillStyle = `rgba(5,14,28,${0.82 * a})`; g.fillRect(bx, by, w, 34);
    g.fillStyle = rgb(hot ? tc : [53, 201, 232], a); g.fillRect(bx, by, 2, 34);
    g.fillStyle = `rgba(230,240,255,${a})`; g.textAlign = 'left'; g.font = 'bold 12px "Malgun Gothic"'; g.fillText(D[k][0], bx + 8, by + 14);
    g.font = '600 12px "Rajdhani","Bahnschrift"'; g.fillStyle = `rgba(159,179,209,${a})`;
    g.fillText(st.pop ? (st.pop >= 10000 ? (st.pop / 10000).toFixed(1) + '만' : st.pop.toLocaleString()) : '—', bx + 8, by + 28);
    g.fillStyle = 'rgba(159,179,209,0.25)'; g.fillRect(bx + w - 40, by + 23, 32, 3);
    g.fillStyle = rgb(tc, a); g.fillRect(bx + w - 40, by + 23, 32 * st.tension / 100, 3);
  }
}
function loop(now) {
  const dt = Math.min(100, now - (last || now)); last = now;
  if (speed) { hour = (hour + dt / 1000 * speed / 20) % 24; document.getElementById('time').value = hour; }
  document.getElementById('clock').textContent = `${String(Math.floor(hour)).padStart(2, '0')}:${String(Math.floor(hour % 1 * 60)).padStart(2, '0')}`;
  if (cam.goal) { const e = 0.08; cam.tx += (cam.goal.tx - cam.tx) * e; cam.ty += (cam.goal.ty - cam.ty) * e; cam.dist += (cam.goal.dist - cam.dist) * e;
    if (Math.abs(cam.goal.dist - cam.dist) < 1 && Math.abs(cam.goal.tx - cam.tx) < 1) cam.goal = null; }
  draw(now);
  document.getElementById('alerts').style.display = document.getElementById('card').style.display === 'block' ? 'none' : 'block';
  document.getElementById('zoomV').textContent = `시점 ${Math.round(pitch() * 180 / Math.PI)}° · 거리 ${Math.round(cam.dist)}`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
